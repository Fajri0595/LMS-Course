<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Courier+Prime&display=swap');

  :root {
    /* Color Palette - Modern Academic Utility */
    --primary: #1e3a5f;
    --primary-dark: #022448;
    --primary-container: #1e3a5f;
    --on-primary: #ffffff;
    --on-primary-container: #8aa4cf;
    
    --secondary: #14b8a6;
    --secondary-hover: #0f766e;
    --secondary-container: #6df5e1;
    --on-secondary: #ffffff;
    --on-secondary-container: #006f64;
    
    --tertiary: #64748b;
    --tertiary-dark: #142538;
    --on-tertiary: #ffffff;
    
    --surface: #f7f9fc;
    --surface-dim: #d8dadd;
    --surface-bright: #f7f9fc;
    --surface-card: #ffffff;
    --surface-container-low: #f2f4f7;
    --surface-container: #eceef1;
    --surface-container-high: #e6e8eb;
    --surface-container-highest: #e0e3e6;
    
    --on-surface: #191c1e;
    --on-surface-variant: #43474e;
    --outline: #74777f;
    --outline-variant: #e2e8f0;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    
    --error: #ba1a1a;
    --error-container: #ffdad6;
    --on-error: #ffffff;
    --on-error-container: #93000a;
    
    /* Semantic Taxonomy Tokens */
    --badge-success-bg: #dcfce7;
    --badge-success-text: #166534;
    --badge-draft-bg: #f1f5f9;
    --badge-draft-text: #475569;
    
    --badge-materi-bg: #dbeafe;
    --badge-materi-text: #1d4ed8;
    --badge-video-bg: #f3e8ff;
    --badge-video-text: #6b21a8;
    --badge-kaidah-bg: #ccfbf1;
    --badge-kaidah-text: #0f766e;
    --badge-latihan-bg: #fef3c7;
    --badge-latihan-text: #b45309;
    --badge-kuis-bg: #e0e7ff;
    --badge-kuis-text: #3730a3;
    
    /* Typography Tokens */
    --font-heading: 'Noto Serif', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Courier Prime', monospace;
    
    /* Elevation Shadows */
    --shadow-0: none;
    --shadow-1: 0 2px 8px -2px rgba(30, 58, 95, 0.06), 0 1px 4px -1px rgba(30, 58, 95, 0.04);
    --shadow-2: 0 8px 20px -4px rgba(30, 58, 95, 0.10), 0 4px 8px -2px rgba(30, 58, 95, 0.04);
    --shadow-3: 0 20px 32px -8px rgba(30, 58, 95, 0.18), 0 8px 16px -4px rgba(30, 58, 95, 0.08);
    
    /* Layout Dimensions */
    --sidebar-width: 260px;
    --header-height: 64px;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-full: 9999px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Reset & Global */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-body);
    font-size: 0.9375rem;
    line-height: 1.5;
    color: var(--on-surface);
    background-color: var(--surface);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Typography Styles */
  h1, h2, h3, .font-serif {
    font-family: var(--font-heading);
    color: var(--primary-dark);
    font-weight: 600;
  }

  h1 {
    font-size: 2rem;
    line-height: 2.5rem;
    letter-spacing: -0.015em;
  }

  h2 {
    font-size: 1.5rem;
    line-height: 2rem;
    letter-spacing: -0.01em;
  }

  h3 {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }

  h4, h5, h6 {
    font-family: var(--font-body);
    font-weight: 600;
    color: var(--primary);
  }

  p {
    color: var(--on-surface-variant);
  }

  /* App Shell Layout */
  #app-root {
    display: flex;
    min-height: 100vh;
    position: relative;
  }

  /* Sidebar Component */
  .sidebar {
    width: var(--sidebar-width);
    background: #ffffff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 40;
    transition: transform 0.3s ease;
  }

  .sidebar-header {
    height: var(--header-height);
    display: flex;
    align-items: center;
    padding: 0 1.25rem;
    gap: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 700;
    font-size: 1.125rem;
    box-shadow: 0 2px 6px rgba(20, 184, 166, 0.3);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
  }

  .brand-title {
    font-family: var(--font-heading);
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--primary-dark);
    line-height: 1.2;
  }

  .brand-subtitle {
    font-size: 0.6875rem;
    color: var(--tertiary);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .sidebar-nav {
    flex: 1;
    padding: 1.25rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    overflow-y: auto;
  }

  .nav-group-title {
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--tertiary);
    font-weight: 600;
    padding: 0.75rem 0.75rem 0.25rem 0.75rem;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.625rem 0.875rem;
    border-radius: var(--radius-md);
    color: var(--on-surface-variant);
    font-weight: 500;
    font-size: 0.875rem;
    text-decoration: none;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
  }

  .nav-item:hover {
    background-color: var(--surface-container-low);
    color: var(--primary);
  }

  .nav-item.active {
    background-color: #eaf2f8;
    color: var(--primary);
    font-weight: 600;
    border-color: #d1e4f4;
  }

  .nav-item.active svg {
    color: var(--secondary);
  }

  .sidebar-footer {
    padding: 1rem;
    border-top: 1px solid var(--border);
    background-color: var(--surface);
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .user-avatar {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-full);
    background-color: var(--primary-container);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.875rem;
    border: 2px solid #ffffff;
    box-shadow: var(--shadow-1);
  }

  .user-info {
    flex: 1;
    overflow: hidden;
  }

  .user-name {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--on-surface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-role {
    font-size: 0.75rem;
    color: var(--tertiary);
    text-transform: capitalize;
  }

  /* Main Wrapper */
  .main-wrapper {
    flex: 1;
    margin-left: var(--sidebar-width);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-width: 0;
    transition: margin-left 0.3s ease;
  }

  /* Topbar Header */
  .topbar {
    height: var(--header-height);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .mobile-toggle-btn {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.5rem;
    border-radius: var(--radius-md);
    color: var(--on-surface);
  }

  .topbar-title {
    font-family: var(--font-heading);
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--primary-dark);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  /* Role Switcher (Untuk Demo & Preview) */
  .role-switcher {
    display: flex;
    align-items: center;
    background: var(--surface-container);
    padding: 0.25rem;
    border-radius: var(--radius-full);
    border: 1px solid var(--border);
  }

  .role-btn {
    border: none;
    background: transparent;
    padding: 0.375rem 0.875rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--tertiary);
    cursor: pointer;
    transition: var(--transition);
  }

  .role-btn.active {
    background: #ffffff;
    color: var(--primary-dark);
    box-shadow: var(--shadow-1);
  }

  /* Page Content Container */
  .content-container {
    flex: 1;
    padding: 1.5rem;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
    border: 1px solid transparent;
    font-family: var(--font-body);
    white-space: nowrap;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background-color: var(--secondary);
    color: #ffffff;
    box-shadow: 0 2px 4px rgba(20, 184, 166, 0.25);
  }

  .btn-primary:hover {
    background-color: var(--secondary-hover);
    box-shadow: 0 4px 8px rgba(20, 184, 166, 0.35);
  }

  .btn-authoritative {
    background-color: var(--primary);
    color: #ffffff;
  }

  .btn-authoritative:hover {
    background-color: var(--primary-dark);
  }

  .btn-outline {
    background-color: #ffffff;
    border-color: var(--border);
    color: var(--primary);
  }

  .btn-outline:hover {
    background-color: var(--surface);
    border-color: var(--border-hover);
  }

  .btn-ghost {
    background-color: transparent;
    color: var(--tertiary);
  }

  .btn-ghost:hover {
    background-color: var(--surface-container-low);
    color: var(--on-surface);
  }

  .btn-danger {
    background-color: var(--error);
    color: #ffffff;
  }

  .btn-danger:hover {
    background-color: #93000a;
  }

  .btn-sm {
    padding: 0.375rem 0.625rem;
    font-size: 0.75rem;
  }

  .btn-lg {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border-radius: var(--radius-md);
  }

  /* Badges & Chips */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.25rem 0.625rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.02em;
  }

  .badge-success { background: var(--badge-success-bg); color: var(--badge-success-text); }
  .badge-draft { background: var(--badge-draft-bg); color: var(--badge-draft-text); }
  
  .badge-materi { background: var(--badge-materi-bg); color: var(--badge-materi-text); }
  .badge-video { background: var(--badge-video-bg); color: var(--badge-video-text); }
  .badge-kaidah { background: var(--badge-kaidah-bg); color: var(--badge-kaidah-text); }
  .badge-latihan { background: var(--badge-latihan-bg); color: var(--badge-latihan-text); }
  .badge-kuis { background: var(--badge-kuis-bg); color: var(--badge-kuis-text); }

  /* Cards */
  .card {
    background: var(--surface-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-1);
    padding: 1.5rem;
    transition: var(--transition);
  }

  .card-hover:hover {
    box-shadow: var(--shadow-2);
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  /* Forms & Inputs */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    margin-bottom: 1.25rem;
  }

  .form-label {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--primary);
  }

  .form-control {
    width: 100%;
    height: 42px;
    padding: 0 0.875rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background-color: #ffffff;
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--on-surface);
    transition: var(--transition);
  }

  .form-control:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
  }

  textarea.form-control {
    height: auto;
    padding: 0.75rem 0.875rem;
    min-height: 100px;
    resize: vertical;
  }

  select.form-control {
    cursor: pointer;
  }

  /* Table Styles */
  .table-container {
    background: #ffffff;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow-1);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  .data-table th {
    background-color: #f8fafc;
    padding: 0.875rem 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--tertiary);
    border-bottom: 1px solid var(--border);
  }

  .data-table td {
    padding: 1rem;
    font-size: 0.875rem;
    border-bottom: 1px solid var(--surface-container-low);
    color: var(--on-surface);
  }

  .data-table tr:hover td {
    background-color: #f8fafc;
  }

  .data-table tr:last-child td {
    border-bottom: none;
  }

  /* Progress Bar */
  .progress-wrapper {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background-color: var(--border);
    border-radius: var(--radius-full);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background-color: var(--secondary);
    border-radius: var(--radius-full);
    transition: width 0.4s ease;
  }

  .progress-text {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--primary);
    min-width: 36px;
    text-align: right;
  }

  /* Grid Layouts */
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: #ffffff;
    padding: 1.25rem;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-1);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .stat-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    background-color: var(--badge-materi-bg);
    color: var(--badge-materi-text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-dark);
    font-family: var(--font-heading);
    line-height: 1.2;
  }

  .stat-label {
    font-size: 0.8125rem;
    color: var(--tertiary);
  }

  .grid-courses {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
  }

  /* Course Player UI */
  .player-container {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1.5rem;
    height: calc(100vh - var(--header-height) - 3rem);
  }

  .player-sidebar {
    background: #ffffff;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .player-sidebar-header {
    padding: 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .player-sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .player-unit-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: var(--transition);
  }

  .player-unit-item:hover {
    background-color: var(--surface-container-low);
  }

  .player-unit-item.active {
    background-color: #eaf2f8;
    border-color: #bcd7ed;
  }

  .player-unit-status {
    width: 24px;
    height: 24px;
    border-radius: var(--radius-full);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition);
  }

  .player-unit-item.completed .player-unit-status {
    background-color: var(--secondary);
    border-color: var(--secondary);
    color: #ffffff;
  }

  /* Sesi Terkunci */
  .player-unit-item.locked {
    opacity: 0.55;
    cursor: not-allowed;
    background-color: transparent !important;
  }

  .player-unit-item.locked:hover {
    background-color: transparent !important;
  }

  .player-unit-item.locked .player-unit-status {
    background-color: var(--surface-container-low);
    border-color: var(--border);
    color: var(--tertiary);
  }

  .player-unit-item.locked .player-unit-title {
    color: var(--tertiary);
  }

  /* Timer Belajar & Video Player Terkunci */
  .study-timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.85rem;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: var(--radius-full);
    font-size: 0.8125rem;
    font-weight: 600;
    color: #0d9488;
    transition: var(--transition);
  }

  .study-timer-badge.completed {
    background: #ecfdf5;
    border-color: #a7f3d0;
    color: #059669;
  }

  .study-timer-badge.paused {
    background: #fffbeb;
    border-color: #fde68a;
    color: #b45309;
  }

  .study-timer-bar {
    width: 60px;
    height: 6px;
    background: #e2e8f0;
    border-radius: 3px;
    overflow: hidden;
  }

  .study-timer-fill {
    height: 100%;
    background: var(--secondary);
    transition: width 0.3s ease;
  }

  .study-timer-badge.completed .study-timer-fill {
    background: #059669;
  }

  .video-player-container {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1.5rem;
    background: #000;
    box-shadow: var(--shadow-2);
  }

  .video-player-container video {
    width: 100%;
    max-height: 480px;
    display: block;
    outline: none;
  }

  .video-lock-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(15, 23, 42, 0.85);
    color: #e2e8f0;
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    pointer-events: none;
    z-index: 10;
  }

  .player-unit-title {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--on-surface);
    flex: 1;
  }

  .player-content-area {
    background: #ffffff;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .player-content-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .player-content-body {
    flex: 1;
    padding: 2rem;
    overflow-y: auto;
  }

  .player-content-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: var(--surface);
  }

  /* =========================================================
   * HIERARCHICAL CURRICULUM (ACCORDION & EXAM SCREEN)
   * ========================================================= */
  .player-sidebar-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
