<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourseHub - Platform Manajemen Pembelajaran & Media Interaktif</title>
  <meta name="description"
    content="Sistem manajemen pembelajaran berbasis Google Apps Script untuk Interactive Flat Panel dan pembelajaran mandiri.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Courier+Prime&display=swap');

    :root {
      /* Color Palette - Modern Academic Utility */
      --primary: #1e3a5f;
      --primary-dark: #022448;
      --primary-container: #1e3a5f;
      --on-primary: #ffffff;
      --on-primary-container: #8aa4cf;

      --secondary: #14b8a6;
      --secondary-hover: #0f766e;
      --secondary-container: #6df5e1;
      --on-secondary: #ffffff;
      --on-secondary-container: #006f64;

      --tertiary: #64748b;
      --tertiary-dark: #142538;
      --on-tertiary: #ffffff;

      --surface: #f7f9fc;
      --surface-dim: #d8dadd;
      --surface-bright: #f7f9fc;
      --surface-card: #ffffff;
      --surface-container-low: #f2f4f7;
      --surface-container: #eceef1;
      --surface-container-high: #e6e8eb;
      --surface-container-highest: #e0e3e6;

      --on-surface: #191c1e;
      --on-surface-variant: #43474e;
      --outline: #74777f;
      --outline-variant: #e2e8f0;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;

      --error: #ba1a1a;
      --error-container: #ffdad6;
      --on-error: #ffffff;
      --on-error-container: #93000a;

      /* Semantic Taxonomy Tokens */
      --badge-success-bg: #dcfce7;
      --badge-success-text: #166534;
      --badge-draft-bg: #f1f5f9;
      --badge-draft-text: #475569;

      --badge-materi-bg: #dbeafe;
      --badge-materi-text: #1d4ed8;
      --badge-video-bg: #f3e8ff;
      --badge-video-text: #6b21a8;
      --badge-kaidah-bg: #ccfbf1;
      --badge-kaidah-text: #0f766e;
      --badge-latihan-bg: #fef3c7;
      --badge-latihan-text: #b45309;
      --badge-kuis-bg: #e0e7ff;
      --badge-kuis-text: #3730a3;

      /* Typography Tokens */
      --font-heading: 'Noto Serif', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Courier Prime', monospace;

      /* Elevation Shadows */
      --shadow-0: none;
      --shadow-1: 0 2px 8px -2px rgba(30, 58, 95, 0.06), 0 1px 4px -1px rgba(30, 58, 95, 0.04);
      --shadow-2: 0 8px 20px -4px rgba(30, 58, 95, 0.10), 0 4px 8px -2px rgba(30, 58, 95, 0.04);
      --shadow-3: 0 20px 32px -8px rgba(30, 58, 95, 0.18), 0 8px 16px -4px rgba(30, 58, 95, 0.08);

      /* Layout Dimensions */
      --sidebar-width: 260px;
      --header-height: 64px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Reset & Global */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--on-surface);
      background-color: var(--surface);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Typography Styles */
    h1,
    h2,
    h3,
    .font-serif {
      font-family: var(--font-heading);
      color: var(--primary-dark);
      font-weight: 600;
    }

    h1 {
      font-size: 2rem;
      line-height: 2.5rem;
      letter-spacing: -0.015em;
    }

    h2 {
      font-size: 1.5rem;
      line-height: 2rem;
      letter-spacing: -0.01em;
    }

    h3 {
      font-size: 1.25rem;
      line-height: 1.75rem;
    }

    h4,
    h5,
    h6 {
      font-family: var(--font-body);
      font-weight: 600;
      color: var(--primary);
    }

    p {
      color: var(--on-surface-variant);
    }

    /* App Shell Layout */
    #app-root {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* Sidebar Component */
    .sidebar {
      width: var(--sidebar-width);
      background: #ffffff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.125rem;
      box-shadow: 0 2px 6px rgba(20, 184, 166, 0.3);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.6875rem;
      color: var(--tertiary);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
      padding: 1.25rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      overflow-y: auto;
    }

    .nav-group-title {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--tertiary);
      font-weight: 600;
      padding: 0.75rem 0.75rem 0.25rem 0.75rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.875rem;
      border-radius: var(--radius-md);
      color: var(--on-surface-variant);
      font-weight: 500;
      font-size: 0.875rem;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background-color: var(--surface-container-low);
      color: var(--primary);
    }

    .nav-item.active {
      background-color: #eaf2f8;
      color: var(--primary);
      font-weight: 600;
      border-color: #d1e4f4;
    }

    .nav-item.active svg {
      color: var(--secondary);
    }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid var(--border);
      background-color: var(--surface);
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background-color: var(--primary-container);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.875rem;
      border: 2px solid #ffffff;
      box-shadow: var(--shadow-1);
    }

    .user-info {
      flex: 1;
      overflow: hidden;
    }

    .user-name {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role {
      font-size: 0.75rem;
      color: var(--tertiary);
      text-transform: capitalize;
    }

    /* Main Wrapper */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-width: 0;
      width: calc(100% - var(--sidebar-width));
      transition: margin-left 0.3s ease, width 0.3s ease;
    }

    /* Topbar Header */
    .topbar {
      height: var(--header-height);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .mobile-toggle-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: var(--radius-md);
      color: var(--on-surface);
    }

    .topbar-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary-dark);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Active User Role Badge in Topbar */
    .user-role-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-container);
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--primary);
      box-shadow: var(--shadow-1);
      transition: var(--transition);
    }

    .role-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--secondary);
      flex-shrink: 0;
    }

    .user-role-pill.role-admin {
      background: #eef2ff;
      border-color: #c7d2fe;
      color: #3730a3;
    }
    .user-role-pill.role-admin .role-indicator-dot {
      background: #4f46e5;
    }

    .user-role-pill.role-educator {
      background: #f0fdfa;
      border-color: #99f6e4;
      color: #0f766e;
    }
    .user-role-pill.role-educator .role-indicator-dot {
      background: #0d9488;
    }

    .user-role-pill.role-student {
      background: #f0f9ff;
      border-color: #bae6fd;
      color: #0369a1;
    }
    .user-role-pill.role-student .role-indicator-dot {
      background: #0284c7;
    }

    /* Page Content Container */
    .content-container {
      flex: 1;
      padding: 1.5rem;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
      border: 1px solid transparent;
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--secondary);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(20, 184, 166, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--secondary-hover);
      box-shadow: 0 4px 8px rgba(20, 184, 166, 0.35);
    }

    .btn-authoritative {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-authoritative:hover {
      background-color: var(--primary-dark);
    }

    .btn-outline {
      background-color: #ffffff;
      border-color: var(--border);
      color: var(--primary);
    }

    .btn-outline:hover {
      background-color: var(--surface);
      border-color: var(--border-hover);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--tertiary);
    }

    .btn-ghost:hover {
      background-color: var(--surface-container-low);
      color: var(--on-surface);
    }

    .btn-danger {
      background-color: var(--error);
      color: #ffffff;
    }

    .btn-danger:hover {
      background-color: #93000a;
    }

    .btn-sm {
      padding: 0.375rem 0.625rem;
      font-size: 0.75rem;
    }

    .btn-lg {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: var(--radius-md);
    }

    /* Badges & Chips */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .badge-success {
      background: var(--badge-success-bg);
      color: var(--badge-success-text);
    }

    .badge-draft {
      background: var(--badge-draft-bg);
      color: var(--badge-draft-text);
    }

    .badge-materi {
      background: var(--badge-materi-bg);
      color: var(--badge-materi-text);
    }

    .badge-video {
      background: var(--badge-video-bg);
      color: var(--badge-video-text);
    }

    .badge-kaidah {
      background: var(--badge-kaidah-bg);
      color: var(--badge-kaidah-text);
    }

    .badge-latihan {
      background: var(--badge-latihan-bg);
      color: var(--badge-latihan-text);
    }

    .badge-kuis {
      background: var(--badge-kuis-bg);
      color: var(--badge-kuis-text);
    }

    /* Cards */
    .card {
      background: var(--surface-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      padding: 1.5rem;
      transition: var(--transition);
    }

    .card-hover:hover {
      box-shadow: var(--shadow-2);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    /* Forms & Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 1.25rem;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--primary);
    }

    .form-control {
      width: 100%;
      height: 42px;
      padding: 0 0.875rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background-color: #ffffff;
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--on-surface);
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
    }

    textarea.form-control {
      height: auto;
      padding: 0.75rem 0.875rem;
      min-height: 100px;
      resize: vertical;
    }

    select.form-control {
      cursor: pointer;
    }

    /* Table Styles */
    .table-container {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-1);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .data-table th {
      background-color: #f8fafc;
      padding: 0.875rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--tertiary);
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--surface-container-low);
      color: var(--on-surface);
    }

    .data-table tr:hover td {
      background-color: #f8fafc;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    /* Progress Bar */
    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background-color: var(--border);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--secondary);
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      min-width: 36px;
      text-align: right;
    }

    /* Grid Layouts */
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #ffffff;
      padding: 1.25rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background-color: var(--badge-materi-bg);
      color: var(--badge-materi-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-dark);
      font-family: var(--font-heading);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.8125rem;
      color: var(--tertiary);
    }

    .grid-courses {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* Course Player UI */
    .player-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      height: calc(100vh - var(--header-height) - 3rem);
    }

    .player-sidebar {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .player-sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .player-unit-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
    }

    .player-unit-item:hover {
      background-color: var(--surface-container-low);
    }

    .player-unit-item.active {
      background-color: #eaf2f8;
      border-color: #bcd7ed;
    }

    .player-unit-status {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .player-unit-item.completed .player-unit-status {
      background-color: var(--secondary);
      border-color: var(--secondary);
      color: #ffffff;
    }

    .player-unit-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--on-surface);
      flex: 1;
    }

    .player-content-area {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-content-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-content-body {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .player-content-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--surface);
    }

    /* IFP Mode */
    .ifp-mode .player-content-body {
      font-size: 1.125rem;
      line-height: 1.8;
    }

    .ifp-mode .player-content-body h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }

    .ifp-mode .btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
    }

    /* Modal Dialogs */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(30, 58, 95, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow-3);
      border: 1px solid var(--border);
      overflow: hidden;
      transform: translateY(12px) scale(0.98);
      transition: transform 0.25s ease;
    }

    .modal-backdrop.active .modal-box {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 1.5rem;
      max-height: calc(85vh - 140px);
      overflow-y: auto;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      background-color: var(--surface);
    }

    /* Toast Alert */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background: var(--primary-dark);
      color: #ffffff;
      padding: 0.875rem 1.25rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-2);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: slideIn 0.3s ease;
    }

    .toast.toast-success {
      border-left: 4px solid var(--secondary);
    }

    .toast.toast-error {
      border-left: 4px solid var(--error);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Responsive Breakpoints */
    @media (max-width: 1024px) {
      .player-container {
        grid-template-columns: 280px 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: var(--shadow-3);
      }

      .main-wrapper {
        margin-left: 0;
        width: 100%;
      }

      .mobile-toggle-btn {
        display: block;
      }

      .player-container {
        grid-template-columns: 1fr;
        height: auto;
      }

      .player-sidebar {
        max-height: 240px;
      }

      .grid-courses {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      const container = document.getElementById('view-container');
      const titleEl = document.getElementById('page-title');

      switch (viewId) {
        case 'admin-dashboard':
          titleEl.textContent = 'Dasbor Utama Administrator';
          renderAdminDashboard(container);
          break;
        case 'educator-dashboard':

    // 6. Interactive Course Player (IFP & Student View)
    function renderCoursePlayer(container, courseId) {
      const course = AppState.courses.find(c => c.id === courseId) || AppState.courses[0];
      AppState.activeCoursePlayer = course;
      const currentUnit = course.contents[AppState.activeUnitIndex] || course.contents[0];

      const completedCount = course.contents.filter(u => u.completed).length;
      const progressPercent = Math.round((completedCount / course.contents.length) * 100);

      let unitsListHtml = course.contents.map((u, idx) => `
        <div class="player-unit-item ${idx === AppState.activeUnitIndex ? 'active' : ''} ${u.completed ? 'completed' : ''}" onclick="selectPlayerUnit(${idx})">
          <div class="player-unit-status">
            ${u.completed ? '✓' : idx + 1}
          </div>
          <div class="player-unit-title">${u.title}</div>
          <span class="badge badge-${u.type.toLowerCase()}" style="font-size:0.6875rem;">${u.type}</span>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="player-container">
          <!-- Sidebar Modul -->
          <div class="player-sidebar">
            <div class="player-sidebar-header">
              <h3 style="font-size:1rem; margin-bottom:0.25rem;">${course.title}</h3>
              <div class="progress-wrapper" style="margin-top:0.75rem;">
                <div class="progress-track">
                  <div class="progress-fill" style="width:${progressPercent}%;"></div>
                </div>
                <span class="progress-text">${progressPercent}%</span>
              </div>
            </div>
            <div class="player-sidebar-list">
              ${unitsListHtml}
            </div>
          </div>

          <!-- Main Content Player -->
          <div class="player-content-area">
            <div class="player-content-header">
              <div style="display:flex; align-items:center; gap:0.75rem;">
                <span class="badge badge-${currentUnit.type.toLowerCase()}">${currentUnit.type}</span>
                <h2 style="font-size:1.25rem;">${currentUnit.title}</h2>
              </div>
              <button class="btn btn-outline btn-sm" onclick="toggleIFPMode()" id="ifp-toggle-btn">
                🖥️ Mode IFP Layar Penuh
              </button>
            </div>

            <div class="player-content-body" id="player-body">
              ${currentUnit.embedUrl ? `
                <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:12px; margin-bottom:1.5rem; background:#000;">
                  <iframe src="${currentUnit.embedUrl}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>
                </div>
              ` : ''}
              <div style="line-height:1.8; font-size:1rem;">
                ${currentUnit.contentBody}
              </div>
            </div>

            <div class="player-content-footer">
              <button class="btn btn-outline" onclick="prevPlayerUnit()" ${AppState.activeUnitIndex === 0 ? 'disabled style="opacity:0.5;"' : ''}>
                ← Unit Sebelumnya
              </button>
              <div style="display:flex; gap:0.75rem;">
                <button class="btn ${currentUnit.completed ? 'btn-outline' : 'btn-primary'}" onclick="markUnitComplete()">
                  ${currentUnit.completed ? '✓ Selesai Dipelajari' : 'Tandai Selesai ✓'}
                </button>
                <button class="btn btn-authoritative" onclick="nextPlayerUnit()" ${AppState.activeUnitIndex === course.contents.length - 1 ? 'disabled style="opacity:0.5;"' : ''}>
                  Unit Selanjutnya →
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectPlayerUnit(idx) {
      AppState.activeUnitIndex = idx;
      renderCoursePlayer(document.getElementById('view-container'), AppState.activeCoursePlayer.id);
    }

    function nextPlayerUnit() {
      if (AppState.activeUnitIndex < AppState.activeCoursePlayer.contents.length - 1) {
        AppState.activeUnitIndex++;
        renderCoursePlayer(document.getElementById('view-container'), AppState.activeCoursePlayer.id);
      }
    }

    function prevPlayerUnit() {
      if (AppState.activeUnitIndex > 0) {
        AppState.activeUnitIndex--;
        renderCoursePlayer(document.getElementById('view-container'), AppState.activeCoursePlayer.id);
      }
    }

    function markUnitComplete() {
      const unit = AppState.activeCoursePlayer.contents[AppState.activeUnitIndex];
      unit.completed = true;
      showToast('Progres tercatat ke database Google Sheets!', 'success');
      renderCoursePlayer(document.getElementById('view-container'), AppState.activeCoursePlayer.id);
    }

    function toggleIFPMode() {
      document.body.classList.toggle('ifp-mode');

      showToast(isIFP ? 'Mode Interactive Flat Panel (IFP) Aktif' : 'Kembali ke tampilan standar', 'success');

    function handleCreateCourse(e) {
      e.preventDefault();
      const title = document.getElementById('course-title').value;
      const desc = document.getElementById('course-desc').value;
      const authorSelect = document.getElementById('course-educator-select');
      const authorName = authorSelect ? authorSelect.value : AppState.user.name;

      const newCourse = {
        id: 'CRS-00' + (AppState.courses.length + 1),
        title: title,
        description: desc,
        authorId: AppState.user.id,
        authorName: authorName,
        status: 'Aktif',
        createdAt: '2026-09-07',
        totalUnits: 0,
        completedUnits: 0,
        enrolledStudents: 0,
        coverGradient: 'linear-gradient(135deg, #1e3a5f 0%, #14b8a6 100%)',
        contents: []
      };

      AppState.courses.unshift(newCourse);
      closeModal();
      showToast(`Course baru berhasil dibuat untuk pengampu ${authorName}!`, 'success');
      if (AppState.currentRole === 'admin') {
        renderAdminDashboard(document.getElementById('view-container'));
      } else {
        navigateTo('educator-dashboard');
      }
    }

    function openModalAddContent(courseId) {
      document.getElementById('modal-title').textContent = 'Tambah Unit Konten Pembelajaran';
      document.getElementById('modal-content').innerHTML = `
        <form id="form-add-unit" onsubmit="handleAddContent(event, '${courseId}')">
          <div class="form-group">
            <label class="form-label">Judul Unit</label>
            <input type="text" id="unit-title" class="form-control" placeholder="Contoh: Video Percobaan Kalorimeter" required>
          </div>
          <div class="form-group">
            <label class="form-label">Jenis Konten</label>
            <select id="unit-type" class="form-control">
              <option value="Materi">Materi (Bacaan & Penjelasan)</option>
              <option value="Video">Video (Embed / Drive)</option>
              <option value="Kaidah">Kaidah (Hukum & Rumus)</option>
              <option value="Latihan">Latihan Soal</option>
              <option value="Kuis">Kuis Evaluasi</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tautan Video / Berkas Google Drive (Opsional)</label>
            <input type="url" id="unit-url" class="form-control" placeholder="https://youtube.com/... atau tautan Drive">
          </div>
          <div class="form-group">
            <label class="form-label">Isi Teks / Panduan Belajar</label>
            <textarea id="unit-body" class="form-control" placeholder="Ketikkan teks materi atau instruksi latihan..."></textarea>
          </div>
        </form>
      `;
      document.getElementById('modal-action-btn').textContent = 'Tambahkan Unit';
      document.getElementById('modal-action-btn').onclick = () => document.getElementById('form-add-unit').requestSubmit();
      document.getElementById('global-modal').classList.add('active');
    }

    function handleAddContent(e, courseId) {
      e.preventDefault();
      const course = AppState.courses.find(c => c.id === courseId);
      if (course) {
        const title = document.getElementById('unit-title').value;
        const type = document.getElementById('unit-type').value;
        const url = document.getElementById('unit-url').value;
        const body = document.getElementById('unit-body').value;

        course.contents.push({
          id: 'CNT-' + Date.now(),
          title: `${course.contents.length + 1}. ${title}`,
          type: type,
          duration: '15 Menit',
          completed: false,
          embedUrl: url,
          contentBody: `<p>${body}</p>`
        });
        course.totalUnits = course.contents.length;
        closeModal();
        showToast('Unit konten berhasil ditambahkan ke kurikulum!', 'success');
        renderCourseEditor(document.getElementById('view-container'), courseId);
      }
    }

    function openModalAddStudent() {
      document.getElementById('modal-title').textContent = 'Tambah Peserta Didik Baru';
      document.getElementById('modal-content').innerHTML = `
        <form id="form-add-student" onsubmit="handleAddStudent(event)">
          <div class="form-group">
            <label class="form-label">Nama Lengkap Siswa</label>
            <input type="text" id="std-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Akun Google Siswa</label>
            <input type="email" id="std-email" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Kelas / Rombel</label>
            <input type="text" id="std-class" class="form-control" value="XII MIPA 1" required>
          </div>
        </form>
      `;
      document.getElementById('modal-action-btn').textContent = 'Daftarkan Siswa';
      document.getElementById('modal-action-btn').onclick = () => document.getElementById('form-add-student').requestSubmit();
      document.getElementById('global-modal').classList.add('active');
    }

    function handleAddStudent(e) {
      e.preventDefault();
      const name = document.getElementById('std-name').value;
      const email = document.getElementById('std-email').value;
      const cls = document.getElementById('std-class').value;

      AppState.students.push({
        id: 'STD-' + Date.now(),
        name: name,
        email: email,
        class: cls,
        progress: 0,
        completedCourses: 0,
        status: 'Aktif'
      });
      closeModal();
      showToast('Peserta didik berhasil didaftarkan!', 'success');
      renderStudentManagement(document.getElementById('view-container'));
    }

    function openModalAddEducator() {
      document.getElementById('modal-title').textContent = 'Tambah Akun Pendidik (Guru)';
      document.getElementById('modal-content').innerHTML = `
        <form id="form-add-edu" onsubmit="handleAddEducator(event)">
          <div class="form-group">
            <label class="form-label">Nama Lengkap & Gelar</label>
            <input type="text" id="edu-name" class="form-control" placeholder="Contoh: Dr. Budi Santoso, M.Pd." required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Institusi</label>
            <input type="email" id="edu-email" class="form-control" placeholder="nama@sekolah.sch.id" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password Akun Pendidik</label>
            <input type="password" id="edu-password" class="form-control" value="Guru123!" minlength="6" required>
            <small style="color:var(--tertiary);font-size:0.75rem;margin-top:0.25rem;display:block;">Minimal 6 karakter. Digunakan untuk login mandiri pendidik.</small>
          </div>
          <div class="form-group">
            <label class="form-label">Bidang Studi / Mata Pelajaran</label>
            <input type="text" id="edu-subj" class="form-control" placeholder="Contoh: Fisika & Sains" required>
          </div>
        </form>
      `;
      document.getElementById('modal-action-btn').textContent = 'Buat Akun Pendidik';
      document.getElementById('modal-action-btn').onclick = () => document.getElementById('form-add-edu').requestSubmit();
      document.getElementById('global-modal').classList.add('active');
    }

    function handleAddEducator(e) {
      e.preventDefault();
      const name = document.getElementById('edu-name').value;
      const email = document.getElementById('edu-email').value;
      const subject = document.getElementById('edu-subj').value;
      AppState.educators.push({
        id: 'USR-' + Date.now(),
        name,
        email,
        subject,
        totalCourses: 0,
        status: 'Aktif'
      });
      closeModal();
      showToast(`Akun Pendidik "${name}" berhasil ditambahkan!`, 'success');
      renderAdminDashboard(document.getElementById('view-container'));
    }

    function openModalEditEducator(id, name, subject, email = '', status = 'Aktif') {
      document.getElementById('modal-title').textContent = 'Edit Profil Pendidik';
      document.getElementById('modal-content').innerHTML = `
        <form id="form-edit-edu" onsubmit="handleEditEducator(event,'${id}')">
          <div class="form-group">
            <label class="form-label">Nama Lengkap & Gelar</label>
            <input type="text" id="edu-edit-name" class="form-control" value="${name}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Institusi</label>
            <input type="email" id="edu-edit-email" class="form-control" value="${email}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Bidang Studi / Mata Pelajaran</label>
            <input type="text" id="edu-edit-subj" class="form-control" value="${subject}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Status Keaktifan</label>
            <select id="edu-edit-status" class="form-control">
              <option value="Aktif" ${status === 'Aktif' ? 'selected' : ''}>Aktif (Masih Mengajar)</option>
              <option value="Nonaktif" ${status === 'Nonaktif' ? 'selected' : ''}>Nonaktif (Tidak Mengajar)</option>
            </select>
          </div>
        </form>
      `;
      document.getElementById('modal-action-btn').textContent = 'Simpan Perubahan';
      document.getElementById('modal-action-btn').onclick = () => document.getElementById('form-edit-edu').requestSubmit();
      document.getElementById('global-modal').classList.add('active');
    }

    function handleEditEducator(e, id) {
      e.preventDefault();
      const name = document.getElementById('edu-edit-name').value.trim();
      const email = document.getElementById('edu-edit-email').value.trim();
      const subject = document.getElementById('edu-edit-subj').value.trim();
      const status = document.getElementById('edu-edit-status').value;

      const edu = AppState.educators.find(e => e.id === id);
      if (edu) {
        edu.name = name;
        edu.email = email;
        edu.subject = subject;
        edu.status = status;
      }
      closeModal();
      showToast('Profil pendidik berhasil diperbarui!', 'success');
      renderAdminDashboard(document.getElementById('view-container'));
    }

    function confirmDeleteEducator(id, name) {
      if (!confirm(`Hapus akun pendidik "${name}"? Tindakan ini permanen.`)) return;
      AppState.educators = AppState.educators.filter(e => e.id !== id);
      showToast(`Akun pendidik "${name}" berhasil dihapus.`, 'success');
      renderAdminDashboard(document.getElementById('view-container'));
    }

    function confirmDeleteCourse(courseId) {
      if (confirm('Apakah Anda yakin ingin menghapus course ini? Semua materi di dalamnya akan diarsipkan.')) {
        AppState.courses = AppState.courses.filter(c => c.id !== courseId);
        showToast('Course berhasil dihapus.', 'error');
        if (AppState.currentRole === 'admin') {
          renderAdminDashboard(document.getElementById('view-container'));
        } else {
          renderEducatorDashboard(document.getElementById('view-container'));
        }
      }
    }

    function closeModal() {
      document.getElementById('global-modal').classList.remove('active');
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${message}</span>`;
      document.getElementById('toast-container').appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3500);
    }

    function toggleMobileSidebar() {
      document.querySelector('.sidebar').classList.toggle('open');
    }

    // Auto Run on Init
    window.addEventListener('load', () => {
      buildSidebarForEducator();
      navigateTo('educator-dashboard');
    });
    // In case DOM is already ready
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      buildSidebarForEducator();
      navigateTo('educator-dashboard');
    }
  </script>
</body>

</html>
