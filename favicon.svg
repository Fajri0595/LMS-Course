<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Icon Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- Academic Knowledge Emblem -->
  <!-- 1. Open Book / Foundation Wings (Styled 'C' Curve) -->
  <path d="M16 38.5 C16 32 23 30.5 32 34 C41 30.5 48 32 48 38.5 C48 42 41 43.5 32 41 C23 43.5 16 42 16 38.5 Z" 
        fill="url(#bookGrad)" fill-opacity="0.9" filter="url(#softGlow)"/>

  <path d="M32 34 V41" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 2. Academic Mortarboard Diamond (Cap Top) -->
  <path d="M32 14 L49 22 L32 30 L15 22 Z" fill="#ffffff" filter="url(#softGlow)"/>

  <!-- 3. Mortarboard Base Skullcap -->
  <path d="M21 25.2 V31 C21 34.5 25.5 37 32 37 C38.5 37 43 34.5 43 31 V25.2 L32 29.8 Z" 
        fill="#e2e8f0" fill-opacity="0.85"/>

  <!-- 4. Golden Graduation Tassel Cord & Charm -->
  <path d="M49 22 V34 C49 35.5 47.5 36 47 34.5 L46.5 28" stroke="url(#tasselGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="47" cy="35" r="2.2" fill="url(#tasselGrad)"/>

  <!-- 5. Central Hub Node -->
  <circle cx="32" cy="22" r="2.5" fill="#1e3a8a"/>
</svg>
